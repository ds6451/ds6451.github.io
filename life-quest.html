<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2a1f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>生活冒险台 · Life Quest</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--gold:#c9a55c;--gold-light:#d4b87a;--gold-dark:#a07f3d;
--brown:#8b4513;--brown-dark:#2a1f17;--brown-medium:#3d2e22;--brown-light:#5a4533;
--parchment:#f5e9d0;--parchment-dark:#d4c5a0;--parchment-light:#faf3e0;
--danger:#c44b3f;--danger-light:#e57368;
--success:#5a8a3e;--success-light:#7ba85f;
--text-dark:#2a1f17;--text-mid:#5a4533;--text-light:#f5e9d0;
--shadow:0 2px 8px rgba(0,0,0,.3);--shadow-lg:0 8px 24px rgba(0,0,0,.4);
}
html,body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
background:var(--brown-dark);color:var(--text-light);line-height:1.6;min-height:100vh;
overscroll-behavior:none;
}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 30%,rgba(201,165,92,.08) 0,transparent 50%),radial-gradient(circle at 80% 70%,rgba(139,69,19,.1) 0,transparent 50%);pointer-events:none;z-index:0}
.app{max-width:680px;margin:0 auto;padding:0 0 90px;position:relative;z-index:1;min-height:100vh}
.serif{font-family:Georgia,"Times New Roman","STSong",serif}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,var(--brown-dark) 0%,rgba(42,31,23,.95) 100%);border-bottom:1px solid var(--gold-dark);padding:10px 16px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.topbar-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-dark));display:flex;align-items:center;justify-content:center;font-weight:bold;color:var(--brown-dark);font-size:14px;flex-shrink:0;border:2px solid var(--gold-dark)}
.avatar-lg{width:64px;height:64px;font-size:24px}
.level{color:var(--gold);font-weight:bold;font-family:Georgia,serif;font-size:14px}
.topbar-coin{color:var(--gold-light);font-size:13px;font-weight:bold;display:flex;align-items:center;gap:4px}
.topbar-coin svg{width:14px;height:14px}
.topbar-time{margin-left:auto;font-size:12px;color:var(--parchment-dark);text-align:right}
.topbar-time .week{font-size:10px;opacity:.7}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:linear-gradient(0deg,var(--brown-dark) 0%,rgba(42,31,23,.98) 100%);border-top:2px solid var(--gold-dark);display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;color:var(--parchment-dark);font-size:11px;cursor:pointer;border:none;background:transparent;transition:color .15s;min-width:0}
.tab-btn.active{color:var(--gold)}
.tab-btn svg{width:22px;height:22px}
.main{padding:12px 16px}
.section{margin-bottom:14px}
.section-title{font-family:Georgia,serif;font-size:16px;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:8px;letter-spacing:1px}
.card{background:var(--brown-medium);border:1px solid rgba(201,165,92,.3);border-radius:10px;padding:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.card-empty{text-align:center;padding:24px 16px;color:var(--parchment-dark)}
.action-card{background:linear-gradient(135deg,var(--brown-medium) 0%,var(--brown-dark) 100%);border:2px solid var(--gold);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.action-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold) 0,var(--gold-light) 50%,var(--gold) 100%)}
.action-name{font-family:Georgia,serif;font-size:18px;color:var(--gold);margin-bottom:4px}
.action-desc{font-size:12px;color:var(--parchment-dark);margin-bottom:10px}
.progress-blocks{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.progress-block{width:36px;height:36px;border-radius:6px;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:18px;font-family:Georgia,serif;background:rgba(245,233,208,.05)}
.progress-block.passed{background:var(--success);border-color:var(--success-light);color:#fff}
.progress-block.failed{background:var(--danger);border-color:var(--danger-light);color:#fff}
.progress-block.pending{border-color:rgba(245,233,208,.3);color:rgba(245,233,208,.3)}
.challenge-now{margin:10px 0;padding:10px;background:rgba(201,165,92,.08);border:1px solid var(--gold-dark);border-radius:8px}
.challenge-now-name{font-family:Georgia,serif;font-size:14px;color:var(--gold);margin-bottom:6px}
.challenge-now-bar{height:8px;background:rgba(201,165,92,.15);border-radius:4px;overflow:hidden;border:1px solid rgba(201,165,92,.25)}
.challenge-now-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold-dark),var(--gold));transition:width 1s linear}
.challenge-now-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--parchment-dark);margin-top:6px;gap:6px}
.challenge-now-meta .mid{padding:3px 8px;background:rgba(201,165,92,.15);border-radius:10px;color:var(--gold)}
.toast.success{background:var(--success);color:#fff;border:1px solid var(--success-light)}
.toast.fail{background:var(--danger);color:#fff;border:1px solid var(--danger-light)}
.toast.perfect{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--brown-dark);border:1px solid var(--gold-light);box-shadow:0 0 12px rgba(201,165,92,.6);font-weight:bold}
.toast.warn{background:#d47a6a;color:#fff;border:1px solid #d47a6a}
@keyframes pulseGold{0%,100%{box-shadow:0 0 0 0 rgba(201,165,92,.5)}50%{box-shadow:0 0 0 6px rgba(201,165,92,0)}}
.challenge-now.ready{border-color:var(--success);animation:pulseGold 1.2s ease-in-out infinite}
.action-meta{font-size:12px;color:var(--parchment-dark);margin-top:8px;display:flex;align-items:center;gap:6px}
.location-card{background:var(--brown-medium);border:1px solid rgba(201,165,92,.3);border-radius:10px;margin-bottom:8px;overflow:hidden}
.location-header{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.location-header:active{background:rgba(245,233,208,.05)}
.location-icon{width:32px;height:32px;flex-shrink:0;color:var(--gold)}
.location-icon svg{width:100%;height:100%}
.location-name{flex:1;font-family:Georgia,serif;font-size:15px;color:var(--gold-light)}
.location-current{font-size:10px;background:var(--success);color:#fff;padding:2px 6px;border-radius:8px;font-weight:bold}
.location-arrow{color:var(--parchment-dark);font-size:14px;transition:transform .2s}
.location-arrow.open{transform:rotate(90deg)}
.location-list{border-top:1px solid rgba(201,165,92,.2);padding:6px}
.action-item{padding:8px 12px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .15s}
.action-item:hover{background:rgba(245,233,208,.08)}
.action-item:active{background:rgba(245,233,208,.15)}
.action-item-name{flex:1;font-size:13px;color:var(--text-light)}
.action-item-cost{font-size:11px;color:var(--gold)}
.character-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.character-id{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.character-id .mbti{font-family:Georgia,serif;font-size:14px;color:var(--gold);letter-spacing:1px}
.character-id .zodiac{font-size:11px;color:var(--parchment-dark)}
.exp-progress{display:flex;flex-direction:column;gap:3px;width:100%;padding:0 4px;margin-top:2px}
.exp-progress .exp-text{font-size:10px;color:var(--parchment-dark);font-family:Georgia,serif;letter-spacing:.3px}
.exp-progress .exp-text .exp-now{color:var(--gold);font-weight:bold}
.exp-progress .exp-bar{height:5px;background:rgba(201,165,92,.15);border-radius:3px;overflow:hidden;border:1px solid rgba(201,165,92,.25)}
.exp-progress .exp-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold-dark),var(--gold));transition:width .4s ease}
.exp-progress.max .exp-text{color:var(--gold);font-weight:bold}
.attr-list{display:flex;flex-direction:column;gap:6px;font-size:20px;font-family:Georgia,serif;color:var(--text-light)}
.attr-row{display:flex;align-items:center;gap:9px;padding:2px 0}
.attr-icon{font-size:22px;width:28px;text-align:center}
.attr-name{flex:1;color:var(--parchment-dark);font-size:18px}
.attr-value{color:var(--gold);font-weight:bold;font-size:22px}
.attr-value.warn{color:var(--danger-light)}
.tags-wrap{display:flex;flex-wrap:wrap;gap:8px}
.tag-card{background:rgba(201,165,92,.15);border:1px solid var(--gold-dark);border-radius:6px;padding:8px 12px;font-size:13px;color:var(--gold-light);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
.tag-card:active{background:rgba(201,165,92,.3);transform:scale(.97)}
.tag-card .tag-id{opacity:.6;font-size:10px;font-family:Georgia,serif}
.tag-card .tag-name{font-weight:bold}
.tag-card.debuff{border-color:var(--danger);background:rgba(170,58,58,.15);color:var(--danger-light)}
.tag-card.debuff:active{background:rgba(170,58,58,.3)}
.grid-2x2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.entry-card{background:var(--brown-medium);border:1px solid rgba(201,165,92,.3);border-radius:10px;padding:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:80px;justify-content:center;transition:all .15s}
.entry-card:active{background:var(--brown-light);transform:scale(.97)}
.entry-card svg{width:32px;height:32px;color:var(--gold)}
.entry-card .label{font-size:13px;color:var(--gold-light)}
.entry-card .meta{font-size:10px;color:var(--parchment-dark)}
.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.team-cell{background:var(--brown-medium);border:1px solid rgba(201,165,92,.3);border-radius:8px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-height:90px;justify-content:center}
.team-cell.empty{border-style:dashed;color:var(--parchment-dark)}
.team-cell .name{font-size:12px;color:var(--gold-light);text-align:center}
.team-cell .level{font-size:10px;color:var(--parchment-dark)}
.team-cell.add-icon{font-size:24px;color:var(--gold-dark)}
.subtabs{display:flex;gap:6px;padding:10px 0;border-bottom:1px solid rgba(201,165,92,.2);margin-bottom:10px}
.subtab{flex:1;padding:8px 12px;background:transparent;border:1px solid transparent;border-radius:6px;color:var(--parchment-dark);font-size:13px;cursor:pointer;text-align:center}
.subtab.active{background:var(--gold);color:var(--brown-dark);font-weight:bold;border-color:var(--gold-dark)}
.subtab:not(.active):hover{background:rgba(245,233,208,.05)}
.goods-card{background:var(--brown-medium);border:1px solid rgba(201,165,92,.3);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;gap:10px;cursor:pointer}
.goods-card:active{background:var(--brown-light)}
.goods-card.owned{opacity:.5;cursor:default}
.goods-icon{width:42px;height:42px;flex-shrink:0;background:var(--parchment);border-radius:8px;padding:6px;display:flex;align-items:center;justify-content:center;color:var(--brown)}
.goods-info{flex:1;min-width:0}
.goods-name{font-size:14px;color:var(--gold-light);margin-bottom:2px}
.goods-desc{font-size:11px;color:var(--parchment-dark);margin-bottom:4px}
.goods-price{font-size:12px;color:var(--gold);font-weight:bold}
.log-card{background:var(--brown-medium);border:1px solid rgba(201,165,92,.3);border-radius:10px;margin-bottom:8px;overflow:hidden}
.log-card-header{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;background:rgba(245,233,208,.03);transition:background .15s}
.log-card-header:active{background:rgba(245,233,208,.08)}
.log-card-name{flex:1;min-width:0;font-size:13px;color:var(--gold-light);font-family:Georgia,serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-card-meta{font-size:10px;color:var(--parchment-dark);line-height:1.3;text-align:right}
.log-card-meta .time{display:block}
.log-card-meta .rewards{display:block;color:var(--gold)}
.log-card-meta .progress{color:var(--parchment-dark)}
.log-card-meta .progress.running{color:var(--gold)}
.log-card-arrow{font-size:10px;color:var(--parchment-dark);transition:transform .2s}
.log-card-arrow.open{transform:rotate(90deg)}
.log-card-body{padding:12px;border-top:1px solid rgba(201,165,92,.15);font-size:11px}
.log-challenge{padding:8px;margin-bottom:6px;background:rgba(245,233,208,.04);border-left:3px solid var(--parchment-dark);border-radius:4px}
.log-challenge.success{border-left-color:var(--success)}
.log-challenge.fail{border-left-color:var(--danger)}
.log-challenge.running{border-left-color:var(--gold);animation:pulseGold 1.5s ease-in-out infinite}
.log-challenge .ch-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-weight:bold;color:var(--gold-light)}
.log-challenge .ch-status{font-size:11px;font-weight:bold}
.log-challenge .ch-status.success{color:var(--success)}
.log-challenge .ch-status.fail{color:var(--danger)}
.log-challenge .ch-status.running{color:var(--gold)}
.log-challenge .ch-detail{font-size:10px;color:var(--parchment-dark);line-height:1.7}
.log-reward-block{padding:10px;background:rgba(201,165,92,.1);border-radius:6px;line-height:1.8}
.log-reward-block .reward-empty{color:var(--parchment-dark)}
.btn{background:var(--brown-medium);color:var(--parchment);border:1px solid var(--gold);border-radius:6px;padding:8px 14px;font-size:13px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;box-sizing:border-box;font-family:inherit;font-weight:500;line-height:1}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--gold);color:var(--brown-dark);border-color:var(--gold-dark);font-weight:600}
.btn-danger{border-color:var(--danger);color:var(--danger-light)}
.btn-ghost{background:transparent;border-color:rgba(201,165,92,.3);color:var(--parchment)}
.btn-sm{padding:4px 10px;font-size:11px;height:30px}
.btn-block{width:100%;justify-content:center}
.onboarding-overlay{position:fixed;inset:0;background:var(--brown-dark);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.onboarding-card{background:var(--brown-medium);border:2px solid var(--gold);border-radius:14px;padding:24px 20px;max-width:480px;width:100%;box-shadow:var(--shadow-lg);margin:auto}
.onboarding-title{font-family:Georgia,serif;font-size:22px;color:var(--gold);text-align:center;margin-bottom:8px;letter-spacing:2px}
.onboarding-subtitle{text-align:center;color:var(--parchment-dark);font-size:12px;margin-bottom:18px}
.option-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.option-grid.col-6{grid-template-columns:repeat(6,1fr)}
.option-cell{background:var(--brown-dark);border:1px solid rgba(201,165,92,.3);border-radius:8px;padding:10px 6px;font-size:11px;color:var(--parchment);cursor:pointer;text-align:center;transition:all .15s;font-family:Georgia,serif}
.option-cell:active{transform:scale(.95)}
.option-cell.selected{background:var(--gold);color:var(--brown-dark);border-color:var(--gold-light);font-weight:bold}
.zodiac-cell{font-size:18px}
.input-group{margin-bottom:14px}
.input-label{display:block;color:var(--parchment-dark);font-size:12px;margin-bottom:6px}
.text-input{width:100%;padding:10px 12px;background:var(--brown-dark);border:1px solid var(--gold-dark);border-radius:6px;color:var(--text-light);font-size:15px;font-family:inherit}
.text-input:focus{outline:none;border-color:var(--gold)}
.onboarding-nav{display:flex;gap:8px;margin-top:14px}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--brown-medium);border-top:2px solid var(--gold);border-radius:14px 14px 0 0;max-width:680px;width:100%;max-height:80vh;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom));position:relative}
.sheet-close{position:absolute;top:12px;right:16px;background:transparent;border:none;color:var(--parchment);font-size:24px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.sheet-icon{width:80px;height:80px;background:var(--parchment);border-radius:12px;padding:10px;color:var(--brown-dark);margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
.sheet-icon svg{width:100%;height:100%}
.sheet-name{font-family:Georgia,serif;font-size:20px;color:var(--gold);text-align:center;margin-bottom:4px}
.sheet-type{text-align:center;color:var(--parchment-dark);font-size:11px;margin-bottom:12px}
.sheet-effects{background:var(--brown-dark);border-radius:8px;padding:12px;margin-bottom:12px}
.sheet-effect{font-size:13px;color:var(--parchment);padding:4px 0;display:flex;gap:8px}
.sheet-effect::before{content:"✓";color:var(--success-light);font-weight:bold;flex-shrink:0}
.sheet-price{font-size:18px;color:var(--gold);font-weight:bold;text-align:center;margin:12px 0}
.sheet-price.warn{color:var(--danger-light)}
.sheet-price-hint{text-align:center;font-size:11px;color:var(--danger-light);margin-bottom:8px}
.sheet-quantity{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}
.qty-btn{width:32px;height:32px;background:var(--brown-dark);border:1px solid var(--gold-dark);color:var(--gold);border-radius:6px;cursor:pointer;font-size:18px}
.qty-display{font-size:18px;color:var(--gold);font-weight:bold;min-width:32px;text-align:center}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--brown-medium);border:2px solid var(--gold);border-radius:14px;padding:24px 20px;max-width:400px;width:100%;box-shadow:var(--shadow-lg);text-align:center}
.modal-title{font-family:Georgia,serif;font-size:22px;color:var(--gold);margin-bottom:12px;letter-spacing:1px}
.modal-title.perfect{color:var(--success-light);text-shadow:0 0 12px rgba(90,138,62,.5)}
.modal-title.normal{color:var(--gold)}
.modal-title.fail{color:var(--danger-light)}
.modal-content{color:var(--parchment);margin-bottom:16px;font-size:14px;line-height:1.7}
.modal-reward{background:var(--brown-dark);border-radius:8px;padding:12px;margin-bottom:16px;color:var(--gold-light);font-size:13px}
.modal-buttons{display:flex;gap:8px}
.bag-card{background:var(--brown-medium);border:1px solid rgba(201,165,92,.3);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.bag-icon{width:40px;height:40px;flex-shrink:0;background:var(--parchment);border-radius:8px;padding:5px;color:var(--brown);display:flex;align-items:center;justify-content:center}
.bag-info{flex:1;min-width:0}
.bag-name{font-size:13px;color:var(--gold-light)}
.bag-desc{font-size:11px;color:var(--parchment-dark)}
.bag-actions{display:flex;gap:6px}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--brown-dark);border:1px solid var(--gold);border-radius:8px;padding:10px 18px;color:var(--gold-light);font-size:13px;z-index:300;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.banner{background:linear-gradient(90deg,rgba(196,75,63,.2),rgba(196,75,63,.1));border:1px solid var(--danger);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12px;display:flex;align-items:center;gap:8px}
.banner-info{border-color:var(--gold);background:linear-gradient(90deg,rgba(201,165,92,.2),rgba(201,165,92,.1))}
.hidden{display:none !important}
@media (max-width:480px){.option-grid{grid-template-columns:repeat(4,1fr)}.option-grid.col-6{grid-template-columns:repeat(6,1fr)}.option-cell{font-size:10px;padding:8px 4px}.tab-btn{font-size:10px}.tab-btn svg{width:20px;height:20px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
<div class="topbar-left">
<div class="avatar" id="topAvatar">?</div>

const STATE = {character:null, currentAction:null, team:[], logs:[], folders:{}, activeTab:'action'};
const STORAGE_KEY = 'wb_lifequest_data';
const VERSION = '2.0';
const HMAC_KEY = 'life-quest-2026-static-key-do-not-rotate';

/* ========== localStorage ========== */
function loadState(){
try{
const raw=localStorage.getItem(STORAGE_KEY);
if(!raw) return false;
const data=JSON.parse(raw);
if(data.version!==VERSION) return false;
STATE.character=data.character||null;
STATE.currentAction=data.currentAction||null;
STATE.team=data.team||[];
STATE.logs=data.logs||[];
STATE.folders=data.folders||{};
return !!STATE.character;
}catch(e){return false}
}
function saveState(){
localStorage.setItem(STORAGE_KEY, JSON.stringify({version:VERSION, character:STATE.character, currentAction:STATE.currentAction, team:STATE.team, logs:STATE.logs, folders:STATE.folders}));
}

/* ========== HMAC ========== */
async function hmacSign(data){
const enc=new TextEncoder();
const key=await crypto.subtle.importKey('raw', enc.encode(HMAC_KEY), {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
const sig=await crypto.subtle.sign('HMAC', key, enc.encode(JSON.stringify(data)));
return btoa(String.fromCharCode(...new Uint8Array(sig)));
}
async function hmacVerify(data, sig){return (await hmacSign(data))===sig;}

/* ========== 导出/导入 ========== */
async function exportData(){
if(!STATE.character){showToast('没有可导出的数据');return}
const payload={data:{character:STATE.character, team:STATE.team, logs:STATE.logs.slice(0,30)}, algorithm:'HMAC-SHA256'};
const sig=await hmacSign(payload.data);
const json=JSON.stringify({...payload, signature:sig}, null, 2);
const blob=new Blob([json],{type:'application/json'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;
a.download=`life-quest-${STATE.character.name}-${Date.now()}.json`;
a.click();
URL.revokeObjectURL(url);
showToast('已导出 JSON 文件');
}
async function importData(jsonStr){
try{
const obj=JSON.parse(jsonStr);
if(!obj.data||!obj.signature) throw new Error('格式错误');
const valid=await hmacVerify(obj.data, obj.signature);
if(!valid) throw new Error('签名验证失败,该角色卡数据被篡改或损坏');
const {character, team, logs}=obj.data;
if(!character||!character.name||!character.mbti) throw new Error('数据不完整');
if(!confirm(`导入 ${character.name} Lv.${character.level} ${character.mbti}?\n\n注意:这会覆盖当前本地数据。`)) return;
STATE.character=character;
STATE.team=team||[];
STATE.logs=logs||[];
STATE.currentAction=null;
saveState();
switchTab(STATE.activeTab);
renderTopbar();
showToast('导入成功');
}catch(e){showToast('导入失败:'+e.message)}
}

function getItemBonus(challenge){
let b=0;
const inv=STATE.character.inventory.goods||{};
const stat = challenge && challenge.stat;
Object.keys(inv).forEach(gid=>{
if((inv[gid]||0)<=0) return;
const g=CONFIG.goods.find(x=>x.id===gid);
if(!g) return;
const effs = Array.isArray(g.effects) ? g.effects : [];
for(const eff of effs){
  if(eff.type !== 'passive_check') continue;
  // passive_check 在 goods 上下文表示持有期间检定加成(默认匹配 challenge.stat)
  if(!eff.target || eff.target === stat) b += (Number(eff.value)||0);
}
});
return b;
}
// tag 累加 score 加成(score_bonus / time_window_bonus / team_bonus)
function getChallengeTagScoreBonus(c){
if(!c) return 0;
let bonus=0;
const tags=STATE.character.tags||[];
const hour=new Date().getHours();
const teamSize=(STATE.team||[]).length;
for(const tid of tags){
const t=CONFIG.tags.find(x=>x.id===tid);
if(!t) continue;
const effs = Array.isArray(t.effects) ? t.effects : [];
for(const eff of effs){
  const v = Number(eff.value)||0;
  const tg = eff.target || null;
  if(eff.type === 'passive_score'){
    if(!tg) bonus += v;
    else if(c.stat && tg === c.stat) bonus += v;
  } else if(eff.type === 'passive_time_window'){
    if(tg){
      const m = String(tg).match(/^(-?\d+)-(-?\d+)$/);
      if(m){
        const lo=parseInt(m[1]), hi=parseInt(m[2]);
        if(hour>=lo && hour<hi) bonus += v;
      }
    }
  } else if(eff.type === 'passive_team'){
    if(tg){
      const m = String(tg).match(/^>=(\d+)$/);
      if(m && teamSize >= parseInt(m[1])) bonus += v;
    }
  }
}
}
return bonus;
}
function calcChallengeResult(aid, cid){
const c=CONFIG.challenges.find(x=>x.id===cid);
if(!c) return null;
const action=CONFIG.actions.find(x=>x.id===aid);
const d20=rollD20();
const stat=c.stat||'will';
const sb=getStatBonus(stat);
const tb=getTagBonus();
const lb=getLevelBonus();
const ib=getItemBonus(); // 背包 goods 加成
const total=d20+sb+tb+lb+ib;
const passScore=getRiskTierPassScore(action);
const offset=getConst('perfect_score_offset') || 5;
const perfectScore=passScore + offset;
let outcome;
if(total >= perfectScore) outcome='perfect';
else if(total >= passScore) outcome='normal';
else outcome='fail';
const success = outcome !== 'fail';
// v2: 字段 success_effects / fail_effects (新格式 effect 数组, 已经在 read_all 阶段解析)
const statReward=success?(c.success_effects||null):(c.fail_effects||null);
let score=0;
if(outcome==='perfect') score=2;
else if(outcome==='normal') score=1;
// tag 加成: score_bonus / time_window_bonus / team_bonus
score += getChallengeTagScoreBonus(c);
return {challengeId:cid, roller:'leader', d20, statBonus:sb, tagBonus:tb, levelBonus:lb, itemBonus:ib, checkTotal:total, passScore, perfectScore, outcome, success, score, statUsed:stat, statBefore:STATE.character.stats.current[stat]||0, statReward, successMessage:c.success_message||null, failMessage:c.fail_message||null};
}
/* ==================== v3 tag_outcomes ==================== */
function parseOutcomeList(raw){
if(!raw) return [];
if(Array.isArray(raw)) return raw;
try { return JSON.parse(raw); } catch(e) { return []; }
}
function applyTagOutcome(out){
try {
if(!out) return;
const tid=out.tag;
const t=CONFIG.tags.find(x=>x.id===tid);
if(!t) return;
STATE.character.tags=STATE.character.tags||[];
if(out.type==='add'){
if(!STATE.character.tags.includes(tid)){
STATE.character.tags.push(tid);
applyTagStatMaxDelta(tid, +1);
}
} else if(out.type==='remove'){
if(STATE.character.tags.includes(tid)){
STATE.character.tags=STATE.character.tags.filter(x=>x!==tid);
applyTagStatMaxDelta(tid, -1);
}
} else if(out.type==='keep'){
// no-op
}
} catch(e) { console.error('applyTagOutcome error', out, e); }
}

// 累加/回退 tag 携带的 stat_max_add 到 STATE.character.attrs
function applyTagStatMaxDelta(tid, sign){
const t=CONFIG.tags.find(x=>x.id===tid);
if(!t) return;
for(let i=1;i<=2;i++){
const et=t['effect'+i+'_type'];
const tg=t['effect'+i+'_target'];
const v=t['effect'+i+'_value']||0;
if(et!=='stat_max_add') continue;
if(!['body','mind','soul','will'].includes(tg)) continue;
const before=STATE.character.attrs[tg]||0;
STATE.character.attrs[tg]=before + sign*v;
const cur=(STATE.character.stats.current[tg]||0);
if(cur>STATE.character.attrs[tg]) STATE.character.stats.current[tg]=STATE.character.attrs[tg];
}
}

// 启动时一次性 fixup: 按当前持有 tag 把 stat_max_add 应用一次(对已有存档的 max 对齐)
function fixupTagStatMax(){
(STATE.character.tags||[]).forEach(tid=>applyTagStatMaxDelta(tid, +1));
}

// 统计当前持有 tag 对 exp/coin 的累加加成
function getTagRewardBonus(){
let expBonus=0, coinBonus=0;
(STATE.character.tags||[]).forEach(tid=>{
const t=CONFIG.tags.find(x=>x.id===tid);
if(!t) return;
for(let i=1;i<=2;i++){
const et=t['effect'+i+'_type'];
const tg=t['effect'+i+'_target'];
const v=t['effect'+i+'_value']||0;
if(tg!=='always') continue;
if(et==='exp_add') expBonus+=v;
else if(et==='coin_add') coinBonus+=v;
}
});
return {exp:expBonus, coin:coinBonus};
}
function applyOutcomeList(outcomes){
const list=parseOutcomeList(outcomes);
list.forEach(o=>{
const chance=(typeof o.chance==='number') ? o.chance : 1.0;
if(Math.random() <= chance) applyTagOutcome(o);
});
}
function applyActionOutcomes(actionId, outcome){

if(!a) return;
const key='tag_outcomes_' + outcome;
applyOutcomeList(a[key]);

if(!c) return;

function getLevelFromExp(exp){
const t=CONFIG.exp_table;
for(let i=t.length-1;i>=0;i--){if(exp>=t[i].exp_required) return t[i].level}
return 1;
}
function getExpToNextLevel(){
const next=CONFIG.exp_table.find(e=>e.level===STATE.character.level+1);
return next?next.exp_required-STATE.character.exp:0;
}
function getExpProgress(){
const lv=STATE.character.level;
const total=STATE.character.exp;
const t=CONFIG.exp_table;
const currentRow=t.find(e=>e.level===lv);
const nextRow=t.find(e=>e.level===lv+1);
if(!currentRow) return {current:0, next:0, ratio:0, isMax:false};
if(!nextRow) return {current:currentRow.exp_required, next:currentRow.exp_required, ratio:1, isMax:true};
const prevSum=t.filter(e=>e.level<lv).reduce((s,e)=>s+e.exp_required, 0);
const curExp=Math.max(0, total-prevSum);
const nextExp=currentRow.exp_required;
const ratio=Math.min(1, curExp/nextExp);
return {current:curExp, next:nextExp, ratio, isMax:false};
}
function formatRemaining(ms){
const total=Math.max(0, Math.ceil(ms/1000));
const d=Math.floor(total/86400);
const h=Math.floor((total%86400)/3600);
const m=Math.floor((total%3600)/60);
const s=total%60;
const hh=String(h).padStart(2,'0');
const mm=String(m).padStart(2,'0');
const ss=String(s).padStart(2,'0');
return d>0 ? `${d}d ${hh}:${mm}:${ss}` : `${hh}:${mm}:${ss}`;
}

// v3 start_condition 判定:返回 {ok, timeWindowStr, failReason}
function checkStartCondition(action){
const c=action.start_condition||{};
const r={ok:true, timeWindowStr:null, failReason:null};
const now=new Date();
const hour=now.getHours();
const day=now.getDay(); // 0=周日
const pad=h=>String(h).padStart(2,'0')+':00';
// timeWindow: [startHour, endHour)
if(Array.isArray(c.timeWindow) && c.timeWindow.length===2){
const [s,e]=c.timeWindow;
r.timeWindowStr=`${pad(s)}-${pad(e)}`;
if(hour<s || hour>=e){ r.ok=false; r.failReason=r.failReason||'不在时间段'; }
}
// daysOfWeek
if(Array.isArray(c.daysOfWeek) && c.daysOfWeek.length){
if(!c.daysOfWeek.includes(day)){ r.ok=false; r.failReason=r.failReason||'不在日期'; }
}
// minTeammates
if(c.minTeammates){
if((STATE.team||[]).length < c.minTeammates){ r.ok=false; r.failReason=r.failReason||`需要 ${c.minTeammates} 队友`; }
}
// requiredTags: 任一队友持有任一标签即满足
if(Array.isArray(c.requiredTags) && c.requiredTags.length){
const has=c.requiredTags.some(t => (STATE.team||[]).some(m => (m.tags||[]).includes(t)));
if(!has){ r.ok=false; r.failReason=r.failReason||'需要特殊队友'; }
}
// requiredAllTeamTags: 全队每个成员都必须持有全部标签
if(Array.isArray(c.requiredAllTeamTags) && c.requiredAllTeamTags.length){
const team=STATE.team||[];
if(team.length===0){ r.ok=false; r.failReason=r.failReason||'需要队友'; }
else{
const allHave=team.every(m => c.requiredAllTeamTags.every(t => (m.tags||[]).includes(t)));
if(!allHave){ r.ok=false; r.failReason=r.failReason||`需要全队队友均持有 ${c.requiredAllTeamTags.join('/')} 标签`; }
}
}
return r;
}

function stopChallengeTicker(){if(_challengeTicker){clearInterval(_challengeTicker); _challengeTicker=null}}
function tickChallenge(){
const ca = STATE.currentAction; if(!ca){stopChallengeTicker(); return}
const idx = ca.currentIndex||0;
const st = ca.challengeStates && ca.challengeStates[idx]; if(!st) return;
if(st.status!=='running') return;
const elapsed = Date.now()-st.startedAt;
const dur = st.duration;
// 中期提示(过半时一次性)
if(!st.midShown && elapsed>=dur/2){st.midShown=true; showToast('挑战进行中…过半了', 'success')}
if(elapsed>=dur){
st.status='awaiting';
saveState();renderMain();
showToast('挑战计时到,点结算开始掷骰','success');
} else {
// 每秒刷新 UI 让进度条和倒计时动起来
renderMain();
}
}
function startCurrentChallenge(){
const ca = STATE.currentAction; if(!ca) return;
const idx = ca.currentIndex||0;
const cid = ca.challenge_ids[idx];
const c = CONFIG.challenges.find(x=>x.id===cid); if(!c) return;
ca.challengeStates = ca.challengeStates || [];
ca.challengeStates[idx] = {status:'running', startedAt:Date.now(), duration:getChallengeDuration(c), midShown:false};
saveState();
// 开场日志(§4.7 推送)
showToast(c.opening_log || c.name, 'success', 3500);
startChallengeTicker();
}

window.resolveCurrentChallenge=function(){
const ca = STATE.currentAction; if(!ca) return;
const idx = ca.currentIndex||0;
const st = ca.challengeStates && ca.challengeStates[idx]; if(!st) return;
if(st.status==='finished') return;
const cid = ca.challenge_ids[idx];
const c = CONFIG.challenges.find(x=>x.id===cid); if(!c) return;
const result = calcChallengeResult(ca.actionId, cid);
// 应用成功/失败结算(挑战层,作用于属性 current — 成功消耗 / 失败更深消耗 / 个别认知类可恢复)
// perfect 时优先用 perfect_effects 子字段(覆盖 success_effects)
if(result.success){
const effects=pickEffectsForOutcome(c, result.outcome);
result.appliedEffects=applyChallengeResolution(effects);
}
if(!result.success){
result.appliedEffects=applyChallengeResolution(c.fail_effects);
}
// v3 §4.4: challenge tag_outcome 生效(完美/普通成功移除 debuff,失败获取 debuff)
applyChallengeOutcomes(cid, result.outcome);
// v3 §4.7: 完美挑战按挑战级掉落
const dropped=maybeDropOnPerfect(result);
result.statAfter = STATE.character.stats.current[result.statUsed]||0;
result.durationMs = Date.now() - st.startedAt;
result.status = 'finished';
result.openingLog = c.opening_log||null;
result.closingLog = c.closing_log||null;
result.challengeName = c.name;
if(dropped) result.droppedItem={itemRef:'goods:'+dropped.id, count:1, name:dropped.name};
ca.results.push(result);
st.status = 'finished';
// 同步到日志占位(logs[0])
const log=STATE.logs.find(l=>l.id===ca.id);
if(log){
log.challengeResults=ca.results.slice();
// 计算当前 actionScore
log.actionScore=ca.results.reduce((s,r)=>s+(r.score||0),0);
}
saveState();
// 结束日志(§4.7)
showToast(c.closing_log || c.name, 'success', 3500);
const bonusSum=result.statBonus+result.tagBonus+result.levelBonus+(result.itemBonus||0);
if(result.outcome==='perfect'){
showToast((c.success_message||'挑战成功!')+` ✨完美 d20(${result.d20})+${bonusSum}=${result.checkTotal} vs 完美${result.perfectScore}`, 'perfect');
} else if(result.outcome==='normal'){
showToast((c.success_message||'挑战成功!')+` 🎲${result.d20}+${bonusSum}=${result.checkTotal} vs 通过${result.passScore}`, 'success');
} else {
showToast((c.fail_message||'挑战失败…')+` 🎲${result.d20}+${bonusSum}=${result.checkTotal} (未达${result.passScore})`, 'fail');
}
renderMain();
// 推进
if((ca.currentIndex+1) >= ca.challenge_ids.length){
setTimeout(()=>finishCurrentAction(), 1200);
} else {
ca.currentIndex = idx+1;
setTimeout(()=>{startCurrentChallenge(); renderMain();}, 1200);
}
};
/* ==================== v3 effect 统一应用 ==================== */
// applyEffect: 统一入口,按 effect.type 分支应用单个 effect 到 STATE
// 返回 {stat, before, after, max, type, target, value}
function applyEffect(eff){
  if(!eff || !eff.type) return null;
  const v = Number(eff.value)||0;
  const t = eff.type;
  const target = eff.target;
  switch(t){
    case 'passive_stat_max':{
      // 拉高属性 max 上限(正向永久)
      if(!target) return null;
      const before = STATE.character.attrs[target]||0;
      const after = Math.max(0, before + v);
      STATE.character.attrs[target] = after;
      return {type:t, target, value:v, stat:target, before, after, max:after};
    }
    case 'passive_stat_current':{
      // buff 期间拉高 current(再 clamp 到 max)
      if(!target) return null;
      const before = STATE.character.stats.current[target]||0;
      const max = STATE.character.attrs[target]||0;
      const after = Math.max(0, Math.min(max, before + v));
      STATE.character.stats.current[target] = after;
      return {type:t, target, value:v, stat:target, before, after, max};
    }
    case 'instant_stat_current':
    case 'resolution_stat_current':{
      // 恢复/消耗 current,clamp [0, max]
      if(!target) return null;
      const before = STATE.character.stats.current[target]||0;
      const max = STATE.character.attrs[target]||0;
      const after = Math.max(0, Math.min(max, before + v));
      STATE.character.stats.current[target] = after;
      return {type:t, target, value:v, stat:target, before, after, max};
    }
    case 'instant_exp':
    case 'passive_exp':{
      const before = (STATE.character.exp||0);
      const after = Math.max(0, before + v);
      STATE.character.exp = after;
      return {type:t, target:null, value:v, stat:'_exp', before, after, max:after};
    }
    case 'resolution_stat_max':{
      // 挑战结算减 max 上限(debuff 用)
      if(!target) return null;
      const before = STATE.character.attrs[target]||0;
      const after = Math.max(0, before + v);
      STATE.character.attrs[target] = after;
      // max 改了,current 可能超,clamp 一次
      const cur = STATE.character.stats.current[target]||0;
      if(cur > after) STATE.character.stats.current[target] = after;
      return {type:t, target, value:v, stat:target, before, after, max:after};
    }
    case 'instant_coin':
    case 'passive_coin':{
      const before = (STATE.character.coin||0);
      const after = before + v;
      STATE.character.coin = after;
      return {type:t, target:null, value:v, stat:'_coin', before, after, max:Infinity};
    }
    // passive_* 的加成/惩罚型 effect(check_bonus / score_bonus / time_window / team / level / mult / task_reward)
    // 由 getTagBonus / getChallengeTagScoreBonus 等读取, 不直接修改 STATE, 这里跳过
    default:
      return null;
  }
}
// applyChallengeResolution: 应用 effects 数组,返回每条的 delta 详情
function applyChallengeResolution(effectsArr){
  if(!effectsArr || !Array.isArray(effectsArr)) return [];
  const out=[];
  for(const eff of effectsArr){
    const r = applyEffect(eff);
    if(r) out.push(r);
  }
  return out;
}
// 选择合适 effects:outcome=perfect 时优先用 perfect_effects(否则用 effects)
function pickEffectsForOutcome(challenge, outcome){
  if(!challenge) return null;
  if(outcome === 'perfect' && Array.isArray(challenge.perfect_effects) && challenge.perfect_effects.length){
    return challenge.perfect_effects;
  }
  return challenge.success_effects || null;
}
window.finishCurrentAction=function(){
const ca = STATE.currentAction; if(!ca) return;
stopChallengeTicker();
const action = CONFIG.actions.find(a=>a.id===ca.actionId);
const results = ca.results;
// actionScore = sum(score)
const actionScore = results.reduce((s,r)=>s+(r.score||0),0);
// tier 三档
let tier='fail';
if(actionScore >= (action.perfectScore||0)) tier='perfect';
else if(actionScore >= (action.passScore||0)) tier='normal';
// 数值层奖励(按 tier,base_reward 为 {normal:{exp,coin}, perfect:{exp,coin}} 分档结构)
const _br=action.base_reward||{};
const _tierBr=_br[tier]||{};
let expR=Math.floor(_tierBr.exp||0);
let coinR=Math.floor(_tierBr.coin||0);
// fail 档数据未定义 → _br['fail']||{} → 0,符合预期
// loc01 perfect 收益减半(原代码保留的 hack)
if(tier==='perfect' && ['a02','a04','a05','a06'].includes(action.id)){
expR=Math.floor(expR*0.6); coinR=Math.floor(coinR*0.6);
}
// tag 累加加成(exp_add / coin_add, target=always)
const _tagBonus = getTagRewardBonus();
if(_tagBonus.exp){expR += _tagBonus.exp;}
if(_tagBonus.coin){coinR += _tagBonus.coin;}
const expBefore = STATE.character.exp;
STATE.character.exp += expR;
STATE.character.coin += coinR;
const newLevel = getLevelFromExp(STATE.character.exp);
const levelUp = newLevel > STATE.character.level;
if(levelUp) STATE.character.level = newLevel;
// 物品层:按 rewardId 解析 rewards
const rewardItems = [];
if(action.rewardId){
const reward = CONFIG.rewards.find(r=>r.id===action.rewardId);
if(reward && Array.isArray(reward.entries)){
if(reward.kind==='fixed'){
reward.entries.forEach(e=>{ if(e.itemRef) rewardItems.push({itemRef:e.itemRef, count:e.count||1}); });
} else if(reward.kind==='independent'){
reward.entries.forEach(e=>{ if(e.itemRef && Math.random() < (e.prob||0)) rewardItems.push({itemRef:e.itemRef, count:1}); });
} else if(reward.kind==='pool'){
const n = reward.draw_count||1;
const pool = reward.entries.filter(e=>e.itemRef);
for(let i=0;i<n;i++){
const sumW = pool.reduce((s,e)=>s+(e.weight||0),0);
let r = Math.random()*sumW;
for(const e of pool){ r -= (e.weight||0); if(r<=0){ rewardItems.push({itemRef:e.itemRef, count:1}); break; } }
}
}
}
// 应用物品到 inventory
rewardItems.forEach(it=>{
const [prefix, refId] = (it.itemRef||'').split(':');
if(prefix==='goods' && refId){
STATE.character.inventory.goods = STATE.character.inventory.goods||{};
STATE.character.inventory.goods[refId] = (STATE.character.inventory.goods[refId]||0) + (it.count||1);
}
});
}
// 写完整 Action Log(§4.3.4)
const finishedAt = Date.now();
const log = {
id: ca.id,
actionId: action.id,
actionName: action.name,
status:'finished',
startedAt: ca.startedAt,
finishedAt,
challengeResults: results.map(r=>({
challengeId:r.challengeId,
challengeName:r.challengeName||null,
roller:r.roller,
d20:r.d20,
statBonus:r.statBonus||0,
tagBonus:r.tagBonus||0,
levelBonus:r.levelBonus||0,
itemBonus:r.itemBonus||0,
checkTotal:r.checkTotal,
passScore:r.passScore||0,
perfectScore:r.perfectScore||0,
outcome:r.outcome,
success:r.success,
score:r.score,
statUsed:r.statUsed,
statBefore:r.statBefore,
statAfter:r.statAfter!=null?r.statAfter:r.statBefore,
statReward:r.statReward||null,
durationMs:r.durationMs||0,
openingLog:r.openingLog||null,
closingLog:r.closingLog||null,
successMessage:r.successMessage||null,
failMessage:r.failMessage||null,
droppedItem:r.droppedItem||null,
appliedEffects:r.appliedEffects||null
})),
actionScore,
tier,
reward:{exp:expR, coin:coinR, items:rewardItems.length?rewardItems:undefined},
teammatesPresent: ca.teammatesPresent||[]
};
// 更新占位 log(若存在),否则新建
const existingIdx = STATE.logs.findIndex(l=>l.id===ca.id);
if(existingIdx>=0){
STATE.logs[existingIdx] = log;
} else {
STATE.logs.unshift(log);
}
if(STATE.logs.length>(getConst('max_logs')||30)) STATE.logs.length=(getConst('max_logs')||30);
const finished=action.name;
STATE.currentAction=null;
// v3 §4.3: action 级 tag_outcomes 生效(完美治疗/普通变化/失败获 debuff)
applyActionOutcomes(ca.actionId, tier);
// v3 §4.6: action 完成后, current ≤ 5 自动消费/购买 goods
try { autoConsumeGoods(); } catch(e) { console.error('autoConsumeGoods', e); }
saveState();
const rewardLines = [];
if(expR>0) rewardLines.push(`+${expR} exp`);
if(coinR>0) rewardLines.push(`+${coinR} 🪙`);
if(rewardItems.length){
rewardItems.forEach(it=>{
const [prefix, refId]=(it.itemRef||'').split(':');
if(prefix==='goods'){
const g=CONFIG.goods.find(x=>x.id===refId);
rewardLines.push(`${g?g.name:refId} ×${it.count||1}`);
}
});
}
if(levelUp) rewardLines.push(`🎉 升级到 Lv.${STATE.character.level}!`);
const title = tier==='perfect'?'✨ 完美通关!':tier==='normal'?'冒险完成':'冒险结束';
showModal(title, `${finished} 完成!\n${rewardLines.join('\n') || '继续努力~'}`, [{text:'继续冒险',action:()=>{closeModal();switchTab('action')}}]);
renderMain();renderTopbar();
};
/* ==================== v3 自动消费/购买 goods ==================== */
function autoConsumeGoods(){
if(!STATE.character || !STATE.character.inventory) return;
const cur=STATE.character.stats.current || {};
const max=STATE.character.attrs || {};
const inv=STATE.character.inventory.goods=STATE.character.inventory.goods||{};
const threshold=(getConst('auto_consume_threshold') != null) ? getConst('auto_consume_threshold') : 5;
const triggerAttrs=Object.keys(cur).filter(k => (cur[k]||0) <= threshold && (max[k]||0) > 0);
if(!triggerAttrs.length) return;
// v2: 找含 instant_stat_current 的 goods
const consumables=(CONFIG.goods||[]).filter(g => Array.isArray(g.effects) && g.effects.some(e => e.type === 'instant_stat_current'));
const events=[];
triggerAttrs.forEach(attr => {
let consumed=false;
for(const g of consumables){
if((inv[g.id]||0) > 0){
inv[g.id] = (inv[g.id]||0) - 1;
// 应用第一个匹配 attr 的 instant_stat_current effect
const eff = g.effects.find(e => e.type === 'instant_stat_current' && (e.target === attr || !e.target));
if(!eff) continue;
const v = Number(eff.value)||5;
const stat = eff.target || attr;
const m = STATE.character.attrs[stat] || 0;
STATE.character.stats.current[stat] = Math.min(m, (STATE.character.stats.current[stat]||0) + v);
events.push(`消耗 ${g.name} → ${stat} +${v}`);
consumed=true;
break;
}
}
if(!consumed){
const g = consumables[0];
if(g && (g.shop_price||0) > 0 && STATE.character.coin >= g.shop_price){
STATE.character.coin -= g.shop_price;
const eff = g.effects && g.effects.find(e => e.type === 'instant_stat_current');
if(!eff) return;
const v = Number(eff.value)||5;
const stat = eff.target || attr;
const m = STATE.character.attrs[stat] || 0;
STATE.character.stats.current[stat] = Math.min(m, (STATE.character.stats.current[stat]||0) + v);
events.push(`自动购买 ${g.name} → ${stat} +${v}`);
}
}
});
if(events.length) showToast('⚠️ 自动消耗: '+events.join(' / '), 'fail', 4500);
}
/* ==================== v3 睡觉恢复 ==================== */
window.sleepAction=function(){
const recovery = getConst('sleep_recovery_per_attr') || 3;
const attrs=STATE.character.stats.current;
const max=STATE.character.attrs;
const log=[];
['body','mind','soul','will'].forEach(k=>{
const m=max[k]||0;
const before=attrs[k]||0;
let delta=recovery;
if(STATE.character.tags && STATE.character.tags.includes('t35')) delta=Math.floor(delta*0.5);
const after=Math.min(m, before+delta);
attrs[k]=after;
log.push(`${k} ${before}→${after}`);
});
try { autoConsumeGoods(); } catch(e) { console.error(e); }
saveState();
showToast('😴 睡醒啦: '+log.join(' / '), 'success', 3500);
renderMain();renderTopbar();
};

window.toggleLog=function(logId){
STATE.folders['log_'+logId]=!STATE.folders['log_'+logId];

function renderLogCardBody(log){
const crs=log.challengeResults||[];
const action=CONFIG.actions.find(a=>a.id===log.actionId);
const totalChal=action?action.challenge_ids.length:crs.length;
const isRunning=log.status==='running';
const lines=[];
lines.push(`<div style="text-align:center;font-family:Georgia,serif;color:var(--gold);font-size:16px;margin-bottom:6px">${log.actionName||log.actionId}</div>`);
const timeLine=isRunning
? `${new Date(log.startedAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} → 进行中...`
: `${new Date(log.startedAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} → ${new Date(log.finishedAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}`;
lines.push(`<div style="text-align:center;color:var(--parchment-dark);font-size:10px;margin-bottom:10px">${timeLine} · 队员 ${(log.teammatesPresent||[]).length||0}</div>`);
lines.push(`<div style="display:flex;justify-content:space-around;margin-bottom:10px;padding:6px;background:rgba(201,165,92,.1);border-radius:6px"><div><div style="font-size:10px;color:var(--parchment-dark)">分数</div><div style="font-size:16px;color:var(--gold);font-weight:bold">${log.actionScore||0}/${totalChal}</div></div><div><div style="font-size:10px;color:var(--parchment-dark)">档位</div><div style="font-size:14px;color:var(--gold);font-weight:bold">${isRunning?'进行中':log.tier==='perfect'?'✓完美':log.tier==='normal'?'●普通':'✕失败'}</div></div></div>`);
lines.push('<div style="font-size:12px;color:var(--gold-light);margin-bottom:6px">🎲 挑战明细</div>');
const ca=STATE.currentAction;
const caRunningId=ca?ca.id:null;
for(let i=0;i<totalChal;i++){
const cid=action.challenge_ids[i];
const cr=CONFIG.challenges.find(c=>c.id===cid);
const r=crs[i];
// 未开始的挑战:不渲染(包括 opening_log)
if(!r && !(isRunning && caRunningId===log.id && ca.currentIndex===i)) continue;
// 该挑战明细上方: opening_log (仅已开始)
if(cr && cr.opening_log){
lines.push(`<div style="padding:6px 8px;background:rgba(245,233,208,.05);border-radius:4px;margin-bottom:4px;font-size:12px;color:var(--parchment);line-height:1.5;font-style:italic">${cr.opening_log}</div>`);
}
if(r){
const bonusParts=[];
if(r.statBonus) bonusParts.push(`属性${r.statBonus>=0?'+':''}${r.statBonus}`);
if(r.tagBonus) bonusParts.push(`词条${r.tagBonus>=0?'+':''}${r.tagBonus}`);
if(r.levelBonus) bonusParts.push(`等级${r.levelBonus>=0?'+':''}${r.levelBonus}`);
if(r.itemBonus) bonusParts.push(`道具${r.itemBonus>=0?'+':''}${r.itemBonus}`);
const bonusTxt=bonusParts.length?'('+bonusParts.join(' ')+')':'';
// 属性变化:每个 effect 单独一行(支持 legacy {stat,value} 与 new {effects:[]})
// 优先用 appliedEffects(含 before/after/max);老存档无该字段时退回只用 delta
const ATTR_N={body:'⚔️ 身体',mind:'🧠 心智',soul:'💧 灵魂',will:'🔥 意志'};
const effectLines=[];
const ae=r.appliedEffects;
if(Array.isArray(ae) && ae.length){
ae.forEach(e=>{
const lbl=ATTR_N[e.stat]||e.stat||'?';
const v=e.value||0;
const sign=v>0?'+':'';
const max=e.max||0;
const after=e.after!=null?e.after:'';
const reachMax = (max>0 && after>=max) ? ' <span style="color:#e0b06a">(已满)</span>' : '';
effectLines.push(`<div style="margin-left:14px">${lbl} ${after}/${max} (${sign}${v})${reachMax}</div>`);
});
} else {
const sr=r.statReward;
if(sr){
if(Array.isArray(sr.effects) && sr.effects.length){
sr.effects.forEach(e=>{
const lbl=ATTR_N[e.stat]||e.stat||'?';
const v=e.value||0;
const sign=v>0?'+':'';
effectLines.push(`<div style="margin-left:14px">${lbl} ${sign}${v}</div>`);
});
} else if(sr.stat){
const lbl=ATTR_N[sr.stat]||sr.stat||'?';
const v=sr.value||0;
const sign=v>0?'+':'';
effectLines.push(`<div style="margin-left:14px">${lbl} ${sign}${v}</div>`);
}
}
}
const msg=r.success?(r.successMessage||'挑战成功'):(r.failMessage||'挑战失败');
// v3 outcome: perfect / normal / fail → 显示对应阈值
const outcome=r.outcome||(r.success?'normal':'fail');
const passScore=r.passScore||0;
const perfectScore=r.perfectScore||(passScore+5);
let thresholdTxt;
if(outcome==='perfect') thresholdTxt=`≥${perfectScore} 完美`;
else if(outcome==='normal') thresholdTxt=`≥${passScore} 通过`;
else thresholdTxt=`<${passScore} 失败`;
const statusLabel = outcome==='perfect' ? '✓ 完美' : outcome==='normal' ? '✓' : '✕';
const statusClass = outcome==='perfect' ? 'perfect' : outcome==='normal' ? 'success' : 'fail';
const detailHtml=`🎲 d20=${r.d20}${bonusTxt} → ${r.checkTotal} ${thresholdTxt}<br>📊 属性变化${effectLines.length?`<br>${effectLines.join('')}`:''}<br>💬 ${msg}`;
lines.push(`<div class="log-challenge ${statusClass}"><div class="ch-title"><span>${i+1}. ${r.challengeName||(cr?cr.name:cid)}</span><span class="ch-status ${statusClass}">${statusLabel}</span></div><div class="ch-detail">${detailHtml}</div></div>`);
// 该挑战明细下方: closing_log (该条挑战已完成即显示,无需等整个 action 结束)
if(cr && cr.closing_log){
lines.push(`<div style="padding:6px 8px;background:rgba(245,233,208,.05);border-radius:4px;margin-top:4px;margin-bottom:10px;font-size:12px;color:var(--parchment);line-height:1.5;font-style:italic">${cr.closing_log}</div>`);
}
} else if(isRunning && caRunningId===log.id && ca.currentIndex===i){
lines.push(`<div class="log-challenge running"><div class="ch-title"><span>${i+1}. ${cr?cr.name:cid}</span><span class="ch-status running">⏳ 进行中</span></div><div class="ch-detail">⏳ 等待判定...</div></div>`);
}
}
const rw=log.reward||{};
const rewardLines=[];
if(rw.exp) rewardLines.push(`+${rw.exp} exp`);
if(rw.coin) rewardLines.push(`+${rw.coin} 🪙`);
if(rw.items && rw.items.length){
rw.items.forEach(it=>{
const [prefix, refId]=(it.itemRef||'').split(':');
if(prefix==='goods'){
const g=CONFIG.goods.find(x=>x.id===refId);
rewardLines.push(`${g?g.name:refId} ×${it.count||1}`);
}
});
}
lines.push('<div style="font-size:12px;color:var(--gold-light);margin:10px 0 6px">💰 奖励</div>');
if(rewardLines.length){
lines.push(`<div class="log-reward-block">${rewardLines.map(l=>`<div>${l}</div>`).join('')}</div>`);
} else {
lines.push(`<div class="log-reward-block reward-empty">${isRunning?'行动进行中,完成后结算':'无奖励'}</div>`);
}
return lines.join('');
}
function renderLogTab(){
if(STATE.logs.length===0) return '<div class="card" style="text-align:center;padding:30px;color:var(--parchment-dark)">还没有挑战记录</div>';
return STATE.logs.map(log=>{
const action=CONFIG.actions.find(a=>a.id===log.actionId);
const crs=log.challengeResults||[];
const totalChal=action?action.challenge_ids.length:crs.length;
const isRunning=log.status==='running';
const isOpen = !!STATE.folders['log_'+log.id];

const r=log.reward||{};

}).join('');
}
window.openLogDetail=function(logId){

window.openTagDetail=function(tagId){
const t=CONFIG.tags.find(x=>x.id===tagId);
if(!t) return;
const isDebuff=t.type==='debuff';
const typeColor=isDebuff?'var(--danger-light)':'var(--gold)';
const typeLabel=isDebuff?'⚠️ Debuff':'✨ Buff';
function describeEffect(eff){
if(!eff || !eff.type) return null;
const et = eff.type;
const tg = eff.target;
const v = Number(eff.value)||0;
const vTxt=v>0?`+${v}`:v<0?`${v}`:`${v}`;
const ATTR={body:'身体',mind:'心智',soul:'灵魂',will:'意志'};
let nl=null;
// v2 枚举(都按 target 裸值判定)
if(et==='passive_stat_max'){
  nl=`${ATTR[tg]||tg||'?'}上限 ${vTxt}`;
} else if(et==='passive_stat_current'){
  nl=`${ATTR[tg]||tg||'?'}当前 ${vTxt}`;
} else if(et==='passive_check'){
  if(tg) nl=`${ATTR[tg]||tg}挑战检定 ${vTxt}`;
  else nl=`挑战检定 ${vTxt}`;
} else if(et==='passive_score'){
  if(tg) nl=`${ATTR[tg]||tg}挑战 ${vTxt} 行动评分`;
  else nl=`每次挑战 ${vTxt} 行动评分`;
} else if(et==='passive_time_window'){
  if(tg) nl=`${tg} 点 ${vTxt} 行动评分`;
} else if(et==='passive_team'){
  if(tg) nl=`队伍 ${tg} 时 ${vTxt} 行动评分`;
} else if(et==='passive_level'){
  if(tg) nl=`角色等级 ${tg} 时挑战检定 ${vTxt}`;
} else if(et==='passive_exp'){
  nl=`每次行动完成 ${vTxt} exp`;
} else if(et==='passive_coin'){
  nl=`每次行动完成 ${vTxt} 🪙`;
} else if(et==='passive_sleep_recovery_mult'){
  nl=`睡眠恢复倍率 ×${v}`;
} else if(et==='passive_coin_mult'){
  nl=`金币获得 ×${v}`;
} else if(et==='passive_task_reward'){
  nl=`任务奖励 ${vTxt}%`;
} else if(et==='instant_stat_current'){
  nl=`立即恢复 ${ATTR[tg]||tg} ${vTxt}`;
} else if(et==='instant_exp'){
  nl=`立即获得 ${vTxt} exp`;
} else if(et==='instant_coin'){
  nl=`立即获得 ${vTxt} 🪙`;
} else if(et==='resolution_stat_current'){
  nl=`${ATTR[tg]||tg} ${vTxt}`;
} else if(et==='resolution_stat_max'){
  nl=`${ATTR[tg]||tg} 上限 ${vTxt}`;
}
if(nl){
return `<div style="padding:6px 8px;background:rgba(201,165,92,.08);border-radius:4px;margin-bottom:6px;color:var(--parchment)">${nl}</div>`;
}
return `<div style="padding:6px 8px;background:rgba(201,165,92,.08);border-radius:4px;margin-bottom:6px"><span style="color:var(--gold-light);font-family:Georgia,serif">${et}</span> · 目标:<b>${tg||'—'}</b> · 数值:<b style="color:${v<0?'var(--danger-light)':'var(--success-light)'}">${vTxt}</b></div>`;
}
const effs=(t.effects||[]).map(e=>describeEffect(e)).filter(Boolean).join('');
const html=`
<div style="display:flex;flex-direction:column;align-items:center;gap:0;line-height:1;margin-bottom:8px">
<div style="font-family:Georgia,serif;font-size:20px;line-height:1;color:${typeColor}">${isDebuff?'⚠️ ':''}${t.name}</div>
<div style="line-height:1"><span style="font-family:Georgia,serif;font-size:12px;color:var(--parchment-dark);background:rgba(0,0,0,.25);padding:2px 6px;border-radius:6px">${t.id}</span></div>
</div>
<div style="display:flex;justify-content:center;gap:6px;flex-wrap:nowrap;margin-bottom:10px">
<span style="padding:2px 8px;border-radius:6px;background:rgba(201,165,92,.15);color:${typeColor};font-weight:bold;font-size:13px">${typeLabel}</span>
</div>
<div style="padding:8px 10px;background:rgba(245,233,208,.05);border-radius:6px;margin-bottom:10px;color:var(--parchment);font-size:13px;line-height:1.5">${t.desc||'暂无描述'}</div>
<div style="font-size:16px;color:var(--gold-light);margin-bottom:10px">🎯 效果</div>
${effs}
${(t.effects && t.effects.length)?'':'<div style="padding:8px;background:rgba(245,233,208,.05);border-radius:6px;color:var(--parchment-dark);font-size:12px;text-align:center">无 effect 配置</div>'}
`;
showModal('词条详情', html, [{text:'关闭',action:closeModal}]);
};

let _qty=1;
window.changeQty=function(d){_qty=Math.max(1,_qty+d);const el=document.getElementById('qtyDisplay');if(el) el.textContent=_qty};
window.buyItem=function(id, kind, price){
if(kind==='tag'){
if(STATE.character.tags.includes(id)) return;
if(STATE.character.coin<price){showToast('金币不足');return}
STATE.character.coin-=price;
STATE.character.tags.push(id);
showToast(`已获得 tag ${CONFIG.tags.find(t=>t.id===id).name}!`);
} else if(kind==='goods'){
const total=price*_qty;
if(STATE.character.coin<total){showToast('金币不足');return}
STATE.character.coin-=total;
STATE.character.inventory.goods[id]=(STATE.character.inventory.goods[id]||0)+_qty;
showToast(`购买 ${_qty} 个 ${CONFIG.goods.find(g=>g.id===id).name}!`);
} else {
showToast('location 通过等级解锁');return;
}
saveState();closeSheet();renderMain();renderTopbar();
};
window.useGoods=function(id){
const qty=STATE.character.inventory.goods[id]||0;
if(qty<=0) return;
const g=CONFIG.goods.find(x=>x.id===id);
if(!g) return;
STATE.character.inventory.goods[id]--;
if(STATE.character.inventory.goods[id]<=0) delete STATE.character.inventory.goods[id];
// v2: 用 applyEffect 统一处理 effects 数组
const effs = Array.isArray(g.effects) ? g.effects : [];
const results = effs.map(e => applyEffect(e)).filter(Boolean);
let msg = `${g.name} 使用`;
if(results.length){
  msg = results.map(r => {
    const sign = r.value>0?'+':'';
    if(r.stat === '_exp') return `exp ${sign}${r.value}`;
    if(r.stat === '_coin') return `coin ${sign}${r.value}`;
    return `${r.stat} ${sign}${r.value}`;
  }).join(' / ');
  msg = `${g.name} 使用,${msg}`;
}
showToast(msg);
saveState();closeSheet();openSheet('bag');renderMain();renderTopbar();
};
window.dropGoods=function(id){
  const g=CONFIG.goods.find(x=>x.id===id);
  if(!g) return;
  const qty=STATE.character.inventory.goods[id]||0;
  if(qty<=0) return;
  if(!confirm(`确认丢弃 1 个 ${g.name}?(剩余 ${qty-1} 个)`)) return;
  STATE.character.inventory.goods[id]=qty-1;
  if(STATE.character.inventory.goods[id]<=0) delete STATE.character.inventory.goods[id];
  showToast(`已丢弃 1 个 ${g.name}`);
  saveState();closeSheet();openSheet('bag');renderMain();renderTopbar();
};
window.kickTeammate=function(idx){
const m=STATE.team[idx];
if(!m) return;
if(!confirm(`确认踢出 ${m.name}?`)) return;
STATE.team.splice(idx,1);
saveState();closeSheet();renderMain();showToast('已踢出');
};
window.importTeamFromSheet=async function(){
const json=document.getElementById('importJson').value.trim();
if(!json){showToast('请粘贴 JSON');return}
try{
const obj=JSON.parse(json);
if(!obj.data||!obj.signature) throw new Error('格式错误');
const valid=await hmacVerify(obj.data, obj.signature);
if(!valid) throw new Error('签名验证失败,该角色卡数据被篡改或损坏');
const {character}=obj.data;
if(!character||!character.name||!character.mbti) throw new Error('数据不完整');
if(STATE.team.length>=3){showToast('队伍已满');return}
if(!confirm(`导入 ${character.name} Lv.${character.level} ${character.mbti}?`)) return;
STATE.team.push(character);
saveState();closeSheet();renderMain();showToast('导入成功');
}catch(e){showToast('导入失败:'+e.message)}
};

function showModal(title, content, buttons, options){
options=options||{};
const root=document.getElementById('modalRoot');
const cls=options.grade==='perfect'?'perfect':options.grade==='normal'?'normal':'fail';
let reward='';
if(options.expReward!==undefined) reward=`<div class="modal-reward">+${options.expReward} exp &nbsp; +${options.coinReward} 🪙</div>`;
const btns=buttons && buttons.length ? buttons : [{text:'好的'}];
const btnHtml=`<div class="modal-buttons">${btns.map((b,i)=>`<button class="btn ${i===0?'btn-primary':'btn-ghost'} btn-block" data-btn-idx="${i}" style="margin-bottom:${i<btns.length-1?'6px':0}">${b.text||'好的'}</button>`).join('')}</div>`;
root.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal"><div class="modal-title ${cls}">${title}</div><div class="modal-content">${content.replace(/\n/g,'<br>')}</div>${reward}${btnHtml}</div></div>`;
// 关键:用 addEventListener 绑定,保留闭包(原 onclick 字符串方式会把函数源码
// 塞到 onclick="" 里,在全局执行时丢失闭包变量,导致 ReferenceError 静默失败)
root.querySelectorAll('[data-btn-idx]').forEach(btn=>{
  const idx=parseInt(btn.getAttribute('data-btn-idx'),10);
  btn.addEventListener('click', ()=>{
    const fn=btns[idx] && btns[idx].action;
    (fn || closeModal)();
  });
});
}
window.closeModal=function(){document.getElementById('modalRoot').innerHTML=''};

/* ========== PWA Bootstrap: Service Worker 注册 + 配置热更新 ==========
 * 加载链:
 *   1. 内嵌 CONFIG 立即渲染(秒开)
 *   2. 后台 fetch ./config.json?v=<ts> (GitHub Pages 部署的远程配置)
 *      ├─ 成功 → 校验版本 → 替换全局 CONFIG → 重渲染 + 提示
 *      ├─ 失败 → localStorage 缓存兜底(上次成功拉取的远程配置)
 *      └─ 无缓存 → 保持内嵌配置(离线冷启动)
 * 说明: 配置只含游戏规则数据,用户存档始终在 localStorage,不受影响
 * ============================================================= */
(function pwaBootstrap(){
  // --- 1. Service Worker 注册(仅 HTTPS / localhost 有效) ---
  if('serviceWorker' in navigator && location.protocol !== 'file:'){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(err){
        console.warn('[pwa] SW 注册失败(忽略,不影响使用):', err);
      });
    });
  }

  // --- 2. 配置热更新 ---
  var CFG_URL = 'config.json';              // 与 HTML 同目录(GitHub Pages)
  var CACHE_KEY = 'lq_remote_config_v1';    // localStorage 缓存键

  function fetchRemoteConfig(){
    return fetch(CFG_URL + '?_=' + Date.now(), {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(data){
        if(!data || !data.actions || !data.challenges) throw new Error('配置结构无效');
        return data;
      });
  }

  function applyRemoteConfig(data, fromCache){
    var oldVer = (CONFIG._meta && CONFIG._meta.version) || '内嵌';
    var newVer = (data._meta && data._meta.version) || '?';
    CONFIG = data;  // 整体替换全局配置(游戏逻辑读 CONFIG 均动态引用)
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }catch(e){}
    // 已初始化则重渲染;未初始化交给 init() 完成
    if(typeof STATE !== 'undefined' && STATE.initialized){
      try{ fixupTagStatMax(); renderMain(); renderTopbar(); }catch(e){ console.error(e); }
    }
    console.log('[pwa] 配置已更新:', oldVer, '→', newVer, fromCache?'(缓存)':'(远程)');
    if(!fromCache && window.showToast){
      showToast('配置已更新到 v' + newVer, 'success');
    }
    return data;
  }

  function tryUpdate(){
    // 优先远程
    fetchRemoteConfig()
      .then(function(data){ applyRemoteConfig(data, false); })
      .catch(function(){
        // 远程失败 → localStorage 缓存兜底(且本地缓存版本比内嵌新才替换)
        try{
          var cached = localStorage.getItem(CACHE_KEY);
          if(cached){
            var cd = JSON.parse(cached);
            var cv = (cd._meta && cd._meta.version)||'0';
            var ev = (CONFIG._meta && CONFIG._meta.version)||'0';
            if(cv !== ev) applyRemoteConfig(cd, true);
            else console.log('[pwa] 远程配置不可达,缓存与内嵌同版本,跳过');
          } else {
            console.log('[pwa] 远程配置不可达,无缓存,使用内嵌配置');
          }
        }catch(e){ console.warn('[pwa] 缓存读取失败:', e); }
      });
  }

  // init 完成后异步执行,不阻塞首屏
  if(document.readyState === 'complete' || document.readyState === 'interactive'){
    setTimeout(tryUpdate, 300);
  } else {
    window.addEventListener('load', function(){ setTimeout(tryUpdate, 300); });
  }
})();
</script>
